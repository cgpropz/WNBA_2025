name: Refresh WNBA data

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      skip_sheets:
        description: 'Set to 1 to skip Google Sheets upload'
        required: false
        default: '1'
  schedule:
    - cron: '0 */3 * * *'

concurrency:
  group: wnba-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data refresh
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PROPS_CASH_TOKEN: ${{ secrets.PROPS_CASH_TOKEN }}
          PYTHONUNBUFFERED: '1'
          SCRAPER_PREFERRED: 'api'
          SKIP_SHEETS: '1'
        working-directory: ${{ github.workspace }}
        run: |
          python "$GITHUB_WORKSPACE/update_all_data.py" --with-extras

      - name: Refresh PrizePicks and Unabated lines
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python wnba-pp-odds.py --write-snapshot
          python unabated_props_data.py

      - name: Commit refreshed data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in \
            wnba_boxscores_2025_2026.csv \
            WNBA_Gamelog_Data.csv \
            last_data_refresh.json \
            wnba_bio_2025.csv \
            wnba_guard_dvp.csv \
            wnba_forward_dvp.csv \
            wnba_center_dvp.csv \
            wnba_advanced_stats.csv \
            wnba_player_stats_25.csv \
            wnba_perMin_stats.csv \
            wnba_projections.csv \
            wnba_calculated_projections.csv \
            WNBA_TeamRank2024.csv \
            Daily_WNBA_lineups.csv \
            downloaded_files/prizepicks_standard.json \
            wnba_player_prop_odds.json \
            wnba_pp_line_matched_odds.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m "chore: refresh WNBA data"
            git push
          fi
